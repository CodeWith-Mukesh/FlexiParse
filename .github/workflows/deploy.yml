
name: Deploy FlexiParse to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove local ChromaDB indexes
        run: |
          rm -rf chroma_db_all-MiniLM-L6-v2
          rm -rf chroma_db_gemini-embedding-001

      - name: Create clean deployment history
        run: |
          git checkout --orphan hf-deploy
          git add -A
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Deploy FlexiParse"

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://DevMukesh:${HF_TOKEN}@huggingface.co/spaces/DevMukesh/Flexiparse
          git push --force space hf-deploy:main
